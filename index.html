<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>羽球首頁測試</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tv-wall {
      margin-top: 60px;
      background: #333;
      color: white;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    .feature-card {
      text-align: center;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    .feature-card:hover {
      transform: translateY(-5px);
      background-color: #f8f9fa;
    }
  </style>
</head>
<body class="bg-light">

  <!-- 導入 header.html -->
  <div id="header-area"></div>

  <div class="container py-5">

    <!-- 電視牆 -->
    <div class="tv-wall">
      ⏳ TV Wall 測試中（放影片、輪播或公告）
    </div>

    <!-- 三個框框 -->
    <div class="row text-center mb-5">
      <div class="col-md-4 mb-4">
        <a href="Search_court.html" style="text-decoration:none; color:#222;">
          <div class="feature-card bg-white">
            <h5>🔍 搜尋球場</h5>
          </div>
        </a>
      </div>
      <div class="col-md-4 mb-4">
        <a href="Search_teams.html" style="text-decoration:none; color:#222;">
          <div class="feature-card bg-white">
            <h5>🏸 搜尋球隊</h5>
          </div>
        </a>
      </div>
      <div class="col-md-4 mb-4">
        <div class="feature-card bg-white">
          <h5>💲 Donate</h5>
        </div>
      </div>
    </div>

    <!-- Q&A 區 -->
    <div class="accordion" id="qaAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header" id="q1">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#a1" aria-expanded="true">
            Q1: 如何加入球隊？
          </button>
        </h2>
        <div id="a1" class="accordion-collapse collapse show" data-bs-parent="#qaAccordion">
          <div class="accordion-body">
            「搜尋球隊」找到你想加入的球隊並聯絡隊長。
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header" id="q2">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#a2">
            Q2: 我要怎麼開新球場？
          </button>
        </h2>
        <div id="a2" class="accordion-collapse collapse" data-bs-parent="#qaAccordion">
          <div class="accordion-body">
            請先登入後點選「新增球場」，填寫資訊後由管理員審核。
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 動態載入 header.html 並導入 header.js
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-area').innerHTML = html;
        const script = document.createElement('script');
        script.src = 'header.js';
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
