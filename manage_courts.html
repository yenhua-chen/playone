<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>球場審核管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .court-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fff;
      transition: box-shadow 0.2s;
    }
    .court-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    @media (max-width: 768px) {
      .container.py-5 {
        padding: 16px !important;
      }
      .court-card {
        padding: 14px;
        font-size: 15px;
      }
      h3.mb-4 {
        font-size: 1.3rem;
      }
      .court-card img {
        max-width: 140px;
      }
    }
    @media (max-width: 480px) {
      .container.py-5 {
        padding: 6px !important;
      }
      .court-card {
        padding: 8px;
        font-size: 14px;
      }
      h3.mb-4 {
        font-size: 1.1rem;
      }
      .court-card img {
        max-width: 100px;
      }
      #header-area {
        margin-bottom: 40px !important;
      }
    }
  </style>
</head>
<body class="bg-light">
  <!-- 導入 header.html -->
  <div id="header-area" style="margin-bottom: 60px;"></div>
  <div class="container py-5">
    <h3 class="mb-4">🏸 待審核球場</h3>
    <div id="court-list"></div>
  </div>

  <script>
    fetch('YH/manage_courts_api.php', {
      credentials: 'include'
    })
    .then(res => res.text())
    .then(text => {
      try {
        const data = JSON.parse(text);

        if (data.code === 403) {
          alert("🚫 無權限，導回首頁");
          location.href = "index.html";
          return;
        }

        const list = document.getElementById('court-list');
        if (data.length === 0) {
          list.innerHTML = '<div class="alert alert-info">目前沒有待審核球場。</div>';
          return;
        }

        for (let court of data) {
          const card = document.createElement('div');
          card.className = 'court-card';

          const equipment = [];
          if (court.has_ac == 1) equipment.push('冷氣');
          if (court.has_water == 1) equipment.push('飲水機');
          if (court.has_parking == 1) equipment.push('好停車');
          if (court.has_shower == 1) equipment.push('盥洗');

          card.innerHTML = `
            <h5>${court.name}</h5>
            <p>${court.city || ''} ${court.district || ''}｜${court.address || ''}</p>
            <p>設備：${equipment.join(' ') || '無'}</p>
            ${court.image_path ? `<img src="uploads/${court.image_path}" style="max-width:200px;" class="mb-2">` : ''}
            <div class="d-flex gap-2 mt-2">
              <button class="btn btn-success btn-sm btn-approve" data-id="${court.id}">✅ 通過</button>
              <button class="btn btn-danger btn-sm btn-reject" data-id="${court.id}">❌ 刪除</button>
            </div>
          `;
          list.appendChild(card);
        }

        document.querySelectorAll('.btn-approve').forEach(btn => {
          btn.addEventListener('click', () => handleAction(btn.dataset.id, 'approve', btn));
        });
        document.querySelectorAll('.btn-reject').forEach(btn => {
          btn.addEventListener('click', () => {
            if (confirm("確定要刪除嗎？")) {
              handleAction(btn.dataset.id, 'reject', btn);
            }
          });
        });

        function handleAction(courtId, action, btn) {
          fetch('YH/manage_court_action.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `court_id=${courtId}&action=${action}`,
            credentials: 'include'
          })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              btn.closest('.court-card').remove();
            } else {
              alert("⚠️ 操作失敗：" + data.message);
            }
          })
          .catch(err => {
            alert("❌ 錯誤：" + err.message);
          });
        }
      } catch (e) {
        console.error("⚠️ 非 JSON 回傳：", text);
        alert("⚠️ 錯誤：後端回傳格式有誤，請打開 Console 查看。");
      }
    });
  </script>
  <script>
    // 動態載入 header.html 並導入 header.js
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header-area').innerHTML = html;
        const script = document.createElement('script');
        script.src = 'header.js';
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
