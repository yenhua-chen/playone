<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>搜尋球隊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
    }
    .team-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .tag {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      background-color: #eee;
      margin-right: 5px;
      margin-top: 5px;
    }
    .search-sidebar {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      position: sticky;
      top: 20px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row">
      <!-- 搜尋結果區 -->
      <div class="col-md-8">
        <h5>台中市，星期四 2025-07-24</h5>

        <!-- 假資料卡片 -->
        <div class="team-card">
          <h6 class="mb-1 text-primary">🏸 羽神同行</h6>
          <p class="mb-1">時間：18:00 - 20:00</p>
          <p class="mb-1">地點：亞柏羽球館</p>
          <p class="mb-1">程度：中階，收費：男270 / 女250</p>
          <div class="mt-2">
            <span class="tag bg-light">冷氣</span>
            <span class="tag bg-warning">新手團</span>
            <span class="tag bg-success">飲水機</span>
            <span class="tag bg-secondary">女友善</span>
          </div>
          <div class="mt-3 text-end">
            <button class="btn btn-outline-primary btn-sm">報名</button>
          </div>
        </div>

        <!-- 你可複製多個 team-card 放更多假資料 -->
      </div>

      <!-- 搜尋條件表單 -->
      <div class="col-md-4">
        <div class="search-sidebar">
          <form>
            <div class="mb-3">
              <label class="form-label">縣市</label>
              <select class="form-select">
                <option>彰化縣</option>
                <option>台北市</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">星期</label>
              <select class="form-select">
                <option>星期一</option>
                <option>星期二</option>
                <option>星期三</option>
                <option>星期四</option>
                <option>星期五</option>
                <option>星期六</option>
                <option>星期日</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">球場</label>
              <input type="text" class="form-control" placeholder="搜尋球場名稱">
            </div>

            <div class="mb-3">
              <label class="form-label">程度</label>
              <select class="form-select">
                <option>不限</option>
                <option>初級</option>
                <option>中級</option>
                <option>高級</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">條件</label><br>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"> <label class="form-check-label">冷氣</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"> <label class="form-check-label">飲水機</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox"> <label class="form-check-label">好停車</label>
              </div>
            </div>

            <button class="btn btn-danger w-100">搜尋</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
