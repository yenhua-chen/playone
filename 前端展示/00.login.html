<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>使用 LINE 登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 120px;
    }
    .login-container {
      max-width: 500px;
      margin: auto;
      text-align: center;
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    .btn-line {
      background-color: #06c755;
      color: white;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-line:hover {
      background-color: #05b34f;
      color: white;
    }
    .line-icon {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="login-container">
    <h2 class="mb-4">登入系統</h2>
    <p class="mb-4 text-muted">請使用 LINE 快速登入</p>

    <a class="btn btn-line" href="https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=2007826048&redirect_uri=http://localhost/callback.php&state=abc123&scope=profile%20openid%20email&prompt=consent">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg" class="line-icon" alt="LINE">
      使用 LINE 登入
    </a>

    <div class="mt-4 text-start text-secondary small border-top pt-3">
      <strong>登入後可使用功能：</strong>
      <ul>
        <li>建立與管理球隊</li>
        <li>快速註冊會員</li>
        <li>串接 LINE 帳號管理功能</li>
      </ul>
    </div>
  </div>

  <script>
    // 自動導入 header.html 並固定於頂部
    fetch('../header.html')
      .then(res => res.text())
      .then(html => {
        const container = document.getElementById('header-container');
        container.innerHTML = html;
        container.classList.add('fixed-header');

        // 執行 header 內的 script
        const scripts = container.querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });

        // 插入 spacer，避免 header 蓋住內容
        let spacer = document.getElementById('header-spacer');
        if (!spacer) {
          spacer = document.createElement('div');
          spacer.id = 'header-spacer';
          spacer.style.height = (container.offsetHeight || 60) + 'px';
          container.parentNode.insertBefore(spacer, container.nextSibling);
        }
      });

    // 加入 header 固定樣式
    const style = document.createElement('style');
    style.textContent = `
      .fixed-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
