<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>註冊新帳號</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 120px;
      font-family: "Noto Sans TC", sans-serif;
    }
    .register-container {
      max-width: 500px;
      margin: auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    .form-control {
      font-size: 16px;
      padding: 10px;
    }
    h2 {
      font-weight: bold;
      color: #2c3e50;
    }
    .error-msg {
      color: red;
      font-size: 14px;
      margin-top: -8px;
      margin-bottom: 12px;
      display: none;
    }

    /* ✅ 自訂亮藍按鈕，hover 變暗藍 */
    .btn-lightblue {
      background-color: #3498db;
      border: none;
      color: white;
      font-size: 18px;
      padding: 12px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }
    .btn-lightblue:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2 class="mb-4 text-center">註冊新帳號</h2>

    <form id="register-form" onsubmit="return validateForm()">
      <div class="mb-3">
        <label for="account" class="form-label">帳號</label>
        <input type="text" class="form-control" id="account" placeholder="請輸入帳號" required minlength="4">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">密碼</label>
        <input type="password" class="form-control" id="password" placeholder="請輸入密碼" required minlength="6">
      </div>

      <div class="mb-3">
        <label for="confirm-password" class="form-label">再次輸入密碼</label>
        <input type="password" class="form-control" id="confirm-password" placeholder="請再次輸入密碼" required minlength="6">
        <div class="error-msg" id="password-error">❌ 密碼不一致</div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">信箱</label>
        <input type="email" class="form-control" id="email" placeholder="請輸入 email" required>
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">暱稱</label>
        <input type="text" class="form-control" id="name" placeholder="請輸入顯示名稱">
      </div>

      <div class="mb-3">
        <label for="address" class="form-label">地址</label>
        <input type="text" class="form-control" id="address" placeholder="請輸入地址">
      </div>

      <!-- ✅ 漸層藍（亮藍→暗藍 hover） -->
      <button type="submit" class="btn-lightblue w-100"> 註冊</button>
    </form>

    <div class="mt-4 text-center">
      已有帳號？<a href="#">前往登入</a>
    </div>
  </div>

  <script>
    function validateForm() {
      const pw1 = document.getElementById('password').value;
      const pw2 = document.getElementById('confirm-password').value;
      const errorMsg = document.getElementById('password-error');

      if (pw1 !== pw2) {
        errorMsg.style.display = 'block';
        return false;
      } else {
        errorMsg.style.display = 'none';
        alert('✅ 驗證成功（此為樣式預覽，尚未送出）');
        return false;
      }
    }
  </script>
</body>
</html>
