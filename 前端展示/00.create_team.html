<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>新增球隊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f7f9fb;
    }
    .form-box {
      max-width: 600px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="form-box">
    <h2 class="mb-4">新增球隊</h2>
    <form>
      <!-- 球隊名稱 -->
      <div class="mb-3">
        <label for="name" class="form-label">球隊名稱</label>
        <input type="text" class="form-control" id="name" placeholder="請輸入球隊名稱">
      </div>

      <!-- 聯絡方式 -->
      <div class="mb-3">
        <label for="contact" class="form-label">聯絡方式</label>
        <input type="text" class="form-control" id="contact" placeholder="如：電話、Email、LINE等">
      </div>

      <!-- 所屬球場 -->
      <div class="mb-3">
        <label for="court" class="form-label">所屬球場</label>
        <select class="form-select" id="court">
          <option selected disabled>請選擇</option>
          <option value="1">峰奇羽球場</option>
          <option value="2">極限羽球場</option>
          <option value="3">翔戰羽球館</option>
        </select>
      </div>

      <!-- 練習時間 -->
      <div class="mb-3">
        <label class="form-label">練習時間（假）</label>
        <div class="row g-2 mb-2">
          <div class="col-md-12">
            <select class="form-select" id="practiceDay">
              <option selected disabled>請選擇星期</option>
              <option>星期一</option>
              <option>星期二</option>
              <option>星期三</option>
              <option>星期四</option>
              <option>星期五</option>
              <option>星期六</option>
              <option>星期日</option>
            </select>
          </div>
        </div>
        <div class="row g-2">
          <div class="col-md-6">
            <input type="time" class="form-control" id="startTime" step="60" placeholder="開始時間">
          </div>
          <div class="col-md-6">
            <input type="time" class="form-control" id="endTime" step="60" placeholder="結束時間">
          </div>
        </div>
      </div>

      <!-- 等級 -->
      <div class="mb-3">
        <label for="level" class="form-label">等級</label>
        <select class="form-select" id="level">
          <option selected disabled>請選擇</option>
          <option>初級</option>
          <option>中級</option>
          <option>高級</option>
          <option>不限</option>
        </select>
      </div>

      <!-- 收費 -->
      <div class="mb-3">
        <label for="fee" class="form-label">收費方式</label>
        <input type="text" class="form-control" id="fee" placeholder="例如：150元／次">
      </div>

      <!-- 備註 -->
      <div class="mb-3">
        <label for="note" class="form-label">備註</label>
        <textarea class="form-control" id="note" rows="3" placeholder="可填隊伍介紹、特殊說明..."></textarea>
      </div>

      <!-- 送出 -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">送出</button>
      </div>
    </form>
  </div>

</body>
</html>
