<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>搜尋球場</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f9f9f9;
      padding-top: 60px;
      padding-bottom: 60px;
    }

    .container {
      max-width: 70%;
    }

    .court-card {
      background-color: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 0 8px rgba(0,0,0,0.02);
      position: relative;
      transition: all 0.3s ease;
    }

    .court-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 14px;
      margin-right: 6px;
      margin-top: 20px;
      font-weight: 500;
    }

    .tag-ac {
      background-color: #d6f3ff;
      color: #0077b6;
    }

    .tag-water {
      background-color: #d3f9d8;
      color: #2d6a4f;
    }

    .tag-parking {
      background-color: #fff3cd;
      color: #9c6f00;
    }

    .distance-label {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      color: #e74c3c;
      font-weight: bold;
      font-size: 18px;
    }

    /* 響應式斷點：小於768px（平板） */
    @media (max-width: 768px) {
      .container {
        max-width: 90%;
      }

      .distance-label {
        font-size: 16px;
        padding: 10px 14px;
      }

      .court-card {
        padding: 20px;
      }
    }

    /* 響應式斷點：小於480px（手機） */
    @media (max-width: 480px) {
      .court-card {
        padding: 16px;
      }

      .distance-label {
        font-size: 14px;
        top: 16px;
        right: 16px;
      }

      .tag {
        font-size: 13px;
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

<!-- 中間置中 -->
<div class="container mx-auto">
  <h2 class="text-center mb-5">搜尋球場</h2>

  <!-- 搜尋表單 -->
  <form class="row g-4 mb-5">
    <div class="col-md-5 col-12">
      <input type="text" class="form-control" placeholder="輸入縣市，如台中市">
    </div>
    <div class="col-md-5 col-12">
      <input type="text" class="form-control" placeholder="輸入鄉鎮區，如西區">
    </div>
    <div class="col-md-2 col-12">
      <button type="submit" class="btn btn-primary w-100">搜尋</button>
    </div>
  </form>

  <!-- 卡片 1 -->
  <div class="court-card">
    <div class="distance-label">距離 10 分鐘</div>
    <h5 class="mb-3 fw-bold">勇咖羽球館</h5>
    <p class="mb-1 text-muted">地址：台中市西區忠明南路100號</p>
    <p class="mb-2">
      <span class="tag tag-ac">冷氣</span>
      <span class="tag tag-water">飲水機</span>
      <span class="tag tag-parking">好停車</span>
    </p>
  </div>

  <!-- 卡片 2 -->
  <div class="court-card">
    <h5 class="mb-3 fw-bold">飛羽館（台中市 北屯區）</h5>
    <p class="mb-1 text-muted">地址：台中市北屯區昌平路二段120號</p>
    <p><span class="tag bg-secondary text-white">盥洗</span></p>
  </div>
</div>

</body>
</html>
